# ==============================================================================
# Pipeline: DevSecOps Security Scans
# ==============================================================================

name: DevSecOps Security Scans

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/**'

jobs:
  gitleaks-scan:
    name: Gitleaks Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov-scan:
    name: Checkov IaC Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          # Omitimos checks irrelevantes para entornos Dev / FinOps o requeridos solo en Prod
          skip_check: CKV_TF_1,CKV_AWS_157,CKV_AWS_293,CKV_AWS_16,CKV_AWS_149,CKV_AWS_118,CKV_AWS_353,CKV_AWS_129,CKV_AWS_161,CKV_AWS_226,CKV2_AWS_30
          soft_fail: false # Fallará si se detecta alguna vulnerabilidad crítica real (ej. credenciales hardcoded o SGs 0.0.0.0/0 innecesarios)
