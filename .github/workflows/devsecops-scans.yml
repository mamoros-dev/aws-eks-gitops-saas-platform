# ==============================================================================
# Pipeline: DevSecOps Scans (Checkov & Gitleaks)
# Escaneo de Seguridad de IaC y Detección de Secretos en Pull Requests
# ==============================================================================

name: DevSecOps Security Scans

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/**'

jobs:
  gitleaks-scan:
    name: Gitleaks Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov-scan:
    name: Checkov IaC Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: false # Cambia a true si quieres advertencias sin bloquear la PR
