# ==============================================================================
# Pipeline: Continuous Integration (CI) - Build & Push Docker Image to ECR
# Integración Continua: Compilar y subir imagen Docker a AWS ECR
# ==============================================================================

name: Build, Push to ECR and Update GitOps Manifests

# 1. TRIGGERS: It runs when there is a push to `main` that modifies the app or the Dockerfile.
# 1. DISPARADORES: Se ejecuta cuando hay push a main modificando la app o el Dockerfile
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/ci-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'

# 2. OIDC Permissions: Required to exchange cryptographic tokens with AWS IAM.
# 2. PERMISOS OIDC: Necesarios para intercambiar tokens criptográficos con AWS IAM
permissions:
  id-token: write # Allows requesting the OIDC JWT token / Permite solicitar el token JWT de OIDC
  contents: write  # Allows cloning the repository's source code / Permite clonar el código fuente del repositorio

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: saas-platform-dev-api # matches your ECR Terraform module exactly / Coincide con el modulo ECR Terraforn creado

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      # Step A: Clone the source code on the GitHub runner
      # Paso A: Clonar el código fuente en el runner de GitHub
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITOPS_PAT_TOKEN }}

      # Step B: Authenticate with AWS using OIDC (without static keys)
      # NOTE: We will temporarily use the AWS Login action
      # Paso B: Autenticarse en AWS usando OIDC (sin claves estáticas)
      # NOTA: Usaremos temporalmente la acción de Login de AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # In the next step, we will configure the IAM OIDC role ARN or the secrets
          # credentials for the first integration test.
          # En el siguiente paso configuraremos la ARN del Role IAM OIDC o las credenciales
          # de secrets para la primera prueba de integración.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Step C: Log in to the AWS ECR registry
      # Paso C: Iniciar sesión en el registro ECR de AWS
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step D: Build the Docker image, tag it, and push it to ECR
      # Paso D: Compilar la imagen Docker, etiquetarla y subirla a ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 1. Build the Docker image using the Dockerfile in src/ / Construir la imagen Docker usando el Dockerfile en src/
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./src

          # 2. Push the tags (commit hash and 'latest') to AWS ECR / Subir las etiquetas (hash del commit y latest) a AWS ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "::notice ::Image uploaded successfully: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # Step E: GitOps Step – Update the tag in kustomization.yaml and push to Git.
      # Step E: PASO GITOPS - Actualizar el tag en kustomization.yaml y hacer push a Git
      - name: Update Kustomize Image Tag & Push to Git
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 1. Install the official Kustomize CLI on the runner / Instalar la CLI oficial de Kustomize en el runner
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

          # 2. Navigate to the folder where the base manifests are located / Navegar a la carpeta donde residen los manifiestos base
          cd k8s/base

          # 3. Update the image reference in kustomization.yaml with the current commit hash / Actualizar la referencia de la imagen en kustomization.yaml con el hash del commit actual
          kustomize edit set image $ECR_REGISTRY/$ECR_REPOSITORY=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # 4. Configure the identity of the official GitHub bot / Configurar la identidad del bot oficial de GitHub
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 5. Commit and push the change only if kustomization.yaml has changed / Hacer commit y push del cambio únicamente si kustomization.yaml ha variado
          git add kustomization.yaml
          git diff-index --quiet HEAD || git commit -m "chore(gitops): update app image tag to ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
